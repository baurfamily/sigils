name: addition
code: |
  1 4 +
output:
stack:
  - 5
---
name: subtraction
code: |
  4 1 -
output:
stack:
  - 3
---
name: multiplication
code: |
  2 3 *
output:
stack:
  - 6
---
name: division
code: |
  8 2 /
output:
stack:
  - 4
---
name: non-integer division
commentary: Division produces a fractional result rather than truncating to an integer.
code: |
  5 2 /
output:
stack:
  - 2.5
---
name: repeating fractional division
commentary: One third is represented approximately using Double precision.
code: |
  1 3 /
output:
stack:
  - 0.3333333333333333
---
name: negative non-integer division
code: |
  -5 2 /
output:
stack:
  - -2.5
---
name: division by zero
commentary: Division by zero consumes its operands and pushes null, preserving deeper values.
code: |
  99 5 0 /
output:
stack:
  - 99
  - null
---
name: zero divided by zero
code: |
  0 0 /
output:
stack:
  - null
---
name: division by negative zero
code: |
  5 -0 /
output:
stack:
  - null
---
name: zero-division result propagates through arithmetic
commentary: Numeric null propagation is provisional.
code: |
  5 0 / 2 +
output:
stack:
  - null
---
name: printing zero-division result emits nothing
commentary: Printing null consumes it without emitting any bytes, including a newline.
code: |
  5 0 / !print
output: |-
stack:
---
name: multiply before addition
commentary: equivalent to 1 + (2 * 3).
code: |
  1 2 3 * +
output:
stack:
  - 7
---
name: add before multiplication
commentary: equivalent to (1 + 2) * 3.
code: |
  1 2 + 3 *
output:
stack:
  - 9
---
name: reordered addition and multiplication
commentary: equivalent to 3 * (2 + 1).
code: |
  3 2 1 + *
output:
stack:
  - 9
---
name: compound subtraction and division preserve operand order
commentary: equivalent to ((20 - (8 / 2)) / 4)
code: |
  20 8 2 / - 4 /
output:
stack:
  - 4
---
name: arithmetic preserves deeper stack values
code: |
  99 10 3 - 2 * 4 /
output:
stack:
  - 99
  - 3.5
