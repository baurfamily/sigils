---
name: simple string
code: |
  "hello, world"
output:
stack:
  - hello, world
---
name: string concatenation
code: |
  "hello" " " + "world" +
output:
stack:
  - hello world
---
name: string concatenation consumes existing stack values
commentary: Both operators consume only existing stack values, preserving string order.
code: |
  "hello" " " "world" + +
output:
stack:
  - hello world
---
name: print value
commentary: The `print` function consumes from the stack.
code: |
  "hello" !print
output: hello
