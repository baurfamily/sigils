# Low-confidence sketches, not implemented or enforced.
# Proposed ->?@index preserves destination entries by inserting instead of replacing.
# The source is still consumed; the ? here would describe destination preservation.
# Tentative gap convention, resolved BEFORE removing the top source:
# For [10, 20, 30], gaps 0, 1, 2, 3 are above 30, below 30, below 20, below 10.
# Negative gap indices count upward from the bottom: -1 is below 10, -2 above 10.
# Removing the source shifts the insertion gap as needed; it never drops other data.
# Syntax, gap indexing, and how source preservation would combine remain open.
