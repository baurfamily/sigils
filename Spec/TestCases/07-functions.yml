name: nested named definitions do not escape their defining call
confidence: medium
commentary: |
  The first pass has nested named calls, not escaping function values. The colon
  in a named definition does not register it in the parent or root environment.
code: |
  {:outer<0
    {:inner<0
      10
    }>1
    !inner
  }>1
  !outer
  !inner
error: unknown-function
output:
stack: [10]
