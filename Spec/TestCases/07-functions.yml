# Function behavior for designer review; runtime support is not implemented yet.
# All cases are medium confidence and therefore enforced by the spec runner.
# Review convention: {:name ...} defines a function in its current lexical scope.
# Private functions declare >N outputs; shared functions omit that annotation.
---
name: defining a function does not execute its body
confidence: medium
code: |
  99
  {:example<0
    "not printed during definition" !print
  }>0
output:
stack: [99]
---
name: shared function operates on the caller stack
confidence: medium
code: |
  {:sum
    +
  }
  99 10 20 !sum
output:
stack: [99, 30]
---
name: consuming private function takes the top input values
confidence: medium
code: |
  {:sum<2
    +
  }>1
  99 10 20 !sum
output:
stack: [99, 30]
---
name: copied private function preserves its original inputs
confidence: medium
code: |
  {:sum?<2
    +
  }>1
  99 10 20 !sum
output:
stack: [99, 10, 20, 30]
---
name: private input order preserves left and right operands
confidence: medium
code: |
  {:difference<2
    -
  }>1
  99 10 3 !difference
output:
stack: [99, 7]
---
name: copied input order preserves left and right operands
confidence: medium
code: |
  {:difference?<2
    -
  }>1
  99 10 3 !difference
output:
stack: [99, 10, 3, 7]
---
name: return count selects the top values in their existing order
confidence: medium
commentary: |
  Proposed return rule: append the top N private values bottom-to-top, discarding
  the rest of the working stack. Returned values must not be reversed.
code: |
  {:pair<0
    1 2 3
  }>2
  99 !pair
output:
stack: [99, 2, 3]
---
name: consuming function with zero outputs discards its working stack
confidence: medium
code: |
  {:discard<2
    30
  }>0
  99 10 20 !discard
output:
stack: [99]
---
name: copied function with zero outputs preserves the caller stack
confidence: medium
code: |
  {:inspect?<2
    +
    !print
  }>0
  99 10 20 !inspect
output: |
  30
stack: [99, 10, 20]
---
name: a function can produce more outputs than inputs
confidence: medium
code: |
  {:pair<0
    10 20
  }>2
  !pair
output:
stack: [10, 20]
---
name: function output remains in execution order
confidence: medium
code: |
  {:greet<0
    "inside" !print
  }>0
