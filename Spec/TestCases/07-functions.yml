  inside
  after
stack: []
---
name: private function can return a null value
confidence: medium
code: |
  {:divide<2
    /
  }>1
  99 1 0 !divide
output:
stack: [99, null]
---
name: bare variables capture their values at definition time
confidence: medium
code: |
  10 ->x
  {:read<0
    x
  }>1
  20 ->x
  !read
output:
stack: [10]
---
name: local writes do not change captured defaults or parent bindings
confidence: medium
code: |
  10 ->x
  {:increment<0
    x 1 + ->x
    x
  }>1
  !increment !increment
  x
output:
stack: [11, 11, 10]
---
name: anonymous function can be stored without executing its body
confidence: medium
commentary: |
  A function literal pushes a callable value. Storage consumes that value;
  !action invokes it later. With no input annotation, it shares the caller stack.
code: |
  {
    "called" !print
  } ->action
  99 !action
output: |
  called
stack: [99]
---
name: anonymous function contrasts copied captures with live parent access
confidence: medium
commentary: |
  Bare x captures 10 when the literal is evaluated. :x retains access to the
  defining parent binding, so it sees 20 at invocation.
code: |
  10 ->x
  {<0
    x :x
  }>2 ->views
  20 ->x
  !views
output:
stack: [10, 20]
---
name: anonymous function local writes leave captured defaults unchanged
confidence: medium
code: |
  10 ->x
  {<0
    x 1 + ->x
    x
  }>1 ->increment
  20 ->x
  !increment !increment
  x
output:
stack: [11, 11, 20]
---
name: returned closure keeps its copied defining value
confidence: medium
commentary: |
  The inner literal captures 10, not the later 20. Its copied value remains
  available after the factory call ends and is unrelated to the root x.
code: |
  99 ->x
  {<0
    10 ->x
    {<0
      x
    }>1
    20 ->x
  }>1 ->makeReader
  !makeReader ->reader
  100 ->x
  !reader !reader
  x
output:
stack: [10, 10, 100]
---
name: returned closure retains and mutates its live defining binding
confidence: medium
commentary: |
  :x and ->:x retain the factory's x binding after the factory returns. Each
  invocation updates that same binding rather than starting a new counter.
code: |
  {<0
    10 ->x
    {<0
      :x 1 + ->:x
      :x
    }>1
  }>1 ->makeCounter
  !makeCounter ->counter
  !counter !counter
output:
stack: [11, 12]
---
name: separate factory calls create independent live captures
confidence: medium
code: |
  {<0
    10 ->x
    {<0
      :x 1 + ->:x
      :x
    }>1
  }>1 ->makeCounter
  !makeCounter ->first
  !makeCounter ->second
  !first !first !second !first !second
output:
stack: [11, 12, 11, 13, 12]
---
name: returned closure distinguishes its retained parent from root and caller
confidence: medium
commentary: |
  :x addresses the factory's retained scope. ::x addresses the lexical root.
  Neither addresses the local x in the function that happens to invoke inspect.
code: |
  100 ->x
  {<0
    10 ->x
    {<0
      :x ::x
    }>2
  }>1 ->makeInspector
  !makeInspector ->inspect
  200 ->x
  {:caller<0
    999 ->x
    !inspect
  }>2
  !caller
output:
stack: [10, 200]
---
name: a function value can be passed through a consuming input stack
confidence: medium
code: |
  {<0
    10
  }>1 ->ten
  {:apply<1
    ->callback
    !callback
  }>1
  ten !apply
output:
stack: [10]
---
name: storing a callable alias preserves its retained binding identity
confidence: medium
commentary: |
  Proposed function-value copy behavior: both bindings invoke the same callable
  with the same explicitly retained outer binding, not cloned counter state.
code: |
  {<0
    10 ->x
    {<0
      :x 1 + ->:x
      :x
    }>1
  }>1 ->makeCounter
  !makeCounter ->counter
  counter ->alias
  !counter !alias !counter
output:
stack: [11, 12, 13]
